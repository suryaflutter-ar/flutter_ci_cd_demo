name: QA Distribution

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  distribute-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable

      - name: Restore google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: android

      - name: Run fastlane QA lane
        working-directory: android
        run: bundle exec fastlane qa
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
